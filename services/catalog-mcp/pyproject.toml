[project]
name = "catalog-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "common",
  "mcp>=1.20",
  "uvicorn[standard]>=0.38",
  "asyncpg>=0.30",
  "pgvector>=0.4",
  "httpx>=0.28",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
