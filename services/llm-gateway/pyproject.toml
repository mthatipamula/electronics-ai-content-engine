[project]
name = "llm-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "common",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "openai>=2.6",
  "azure-identity>=1.25",
  "asyncpg>=0.30",
  "redis>=6.4",
  "tiktoken>=0.12",
  "pyyaml>=6.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
