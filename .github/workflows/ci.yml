name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: packages/common/src:services/llm-gateway/src:services/catalog-mcp/src:services/content-engine/src

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.4" }
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install && az bicep build --file infra/azure/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/azure/main.bicep

  # The whole stack in Docker with the deterministic mock model: real services, real MCP, real queue, no model cost.
  integration:
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.4" }
      - run: uv sync --frozen
      - run: ./scripts/init-env.sh
      - run: docker compose up -d --build
      - name: Wait for the content engine
        run: timeout 180 bash -c 'until curl -sf http://localhost:8002/healthz; do sleep 3; done'
      - run: uv run --no-sync python scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail=200
